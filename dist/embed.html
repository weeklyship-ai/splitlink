<title>SplitLink 分帳連結</title>
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #f0eee8;
  --text: #1d1c1a;
  --muted: #6f6b63;
  --line: #e4e1d9;
  --accent: #1f7a5a;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1ea;
  --pos: #1f7a5a;
  --neg: #c2412d;
  --neg-soft: #fbe9e5;
  --warn-soft: #fff4d6;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 6px 20px rgb(0 0 0 / 0.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1d1d1a; --surface-2: #26261f; --text: #efede6; --muted: #a29e93;
    --line: #34332d; --accent: #4cc596; --accent-ink: #0d1f17; --accent-soft: #1b3a2d; --pos: #4cc596;
    --neg: #ff8a73; --neg-soft: #3d221c; --warn-soft: #3a3118; --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1d1d1a; --surface-2: #26261f; --text: #efede6; --muted: #a29e93;
  --line: #34332d; --accent: #4cc596; --accent-ink: #0d1f17; --accent-soft: #1b3a2d; --pos: #4cc596;
  --neg: #ff8a73; --neg-soft: #3d221c; --warn-soft: #3a3118; --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.top-in { max-width: 640px; margin: 0 auto; padding: 12px 16px 8px; display: flex; align-items: center; gap: 8px; }
.top h1 { font-size: 19px; margin: 0; letter-spacing: 0.01em; }
.icon-btn { border: 0; background: transparent; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
.icon-btn:hover { background: var(--surface-2); }

.tabs { max-width: 640px; margin: 0 auto; padding: 0 16px 8px; display: flex; gap: 6px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
.tab.on { background: var(--text); color: var(--bg); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }
.card h3 { margin: 0 0 10px; font-size: 15px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.item:first-child { border-top: 0; }
button.item:hover { background: var(--surface-2); }
.ico { width: 38px; height: 38px; flex: none; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; font-size: 19px; }
.amt { text-align: right; flex: none; }
.amt b { display: block; font-weight: 600; }
.day { font-size: 12px; color: var(--muted); margin: 18px 4px 6px; font-weight: 600; }

.hero { padding: 26px 4px 6px; }
.hero h2 { font-size: 26px; margin: 0 0 6px; line-height: 1.25; }
.hero p { margin: 0; color: var(--muted); }
.feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 16px 0; }
.feat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13px; color: var(--muted); }
.feat b { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }

.mebar { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: 13px; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600; }

.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; }

.banner { background: var(--warn-soft); border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: 14px; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 550; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--neg); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.fab { position: fixed; right: max(16px, calc(50vw - 304px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6;
  border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 650; padding: 14px 20px; border-radius: 999px; box-shadow: var(--shadow); font-size: 15px; }

/* bars */
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; position: relative; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.dbar { height: 10px; position: relative; margin-top: 6px; }
.dbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.dbar i { position: absolute; top: 0; height: 100%; border-radius: 99px; }
.dbar i.p { left: 50%; background: var(--pos); }
.dbar i.n { right: 50%; background: var(--neg); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.38); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 8px 18px calc(20px + env(safe-area-inset-bottom)); animation: up .2s ease; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -8px; background: var(--surface); padding: 10px 0 8px; z-index: 1; }
.sheet-h h2 { font-size: 18px; margin: 0; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* forms */
label.f { display: block; margin: 12px 0; }
label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
.in { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 11px; padding: 10px 12px; outline: none; }
.in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.in.big { font-size: 26px; font-weight: 650; padding: 8px 12px; }
textarea.in { resize: vertical; min-height: 84px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.amtrow { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
.seg { display: flex; background: var(--surface-2); padding: 3px; border-radius: 11px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: 9px; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / 0.1); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cats button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 10px; font-size: 13px; }
.cats button.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.split-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.split-row:first-child { border-top: 0; }
.split-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.split-row .in { width: 96px; padding: 6px 8px; text-align: right; }
.split-hint { font-size: 13px; margin-top: 6px; }
.err { color: var(--neg); font-size: 13px; min-height: 18px; margin-top: 6px; }
.linkbox { word-break: break-all; font-size: 12px; font-family: ui-monospace, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 110px; overflow: auto; }
.qr { display: grid; place-items: center; margin: 12px 0; }
.qr img, .qr svg { width: 200px; height: 200px; background: #fff; padding: 8px; border-radius: 12px; }

.mem-row { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.mem-row:first-of-type { border-top: 0; }
.mem-row .in.small { padding: 7px 10px; font-size: 13px; }
.paychip { display: inline-block; margin-top: 4px; border: 1px dashed var(--accent); background: transparent; color: var(--text); border-radius: 8px; padding: 3px 8px; font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.share-btn { position: relative; }
.share-btn .dot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--neg); border: 2px solid var(--bg); }
.settle-img { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; margin-bottom: 8px; }
.steps { padding-left: 20px; line-height: 1.9; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 40; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: var(--shadow); animation: up .2s ease; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty .big { font-size: 40px; }
footer.foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 30px; }
