<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f6f5f1;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#1d1c1a;display:flex;align-items:center;gap:56px;padding:0 72px;box-sizing:border-box;position:relative}
body::before{content:"";position:absolute;inset:0 0 auto 0;height:14px;background:#1f7a5a}
.l{flex:1}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;color:#1f7a5a}
.brand img{width:56px;height:56px;border-radius:14px}
h1{font-size:76px;line-height:1.12;margin:26px 0 22px;font-weight:800;letter-spacing:-1px}
p{font-size:30px;color:#5d5a52;margin:0;line-height:1.5}
.tags{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.tags span{background:#e2f1ea;color:#16583f;font-size:24px;font-weight:700;padding:8px 16px;border-radius:999px}
.card{width:420px;background:#fff;border-radius:28px;box-shadow:0 10px 40px rgb(0 0 0/.08);padding:28px 30px}
.card .k{font-size:20px;color:#6f6b63;font-weight:700}
.card .t{font-size:30px;font-weight:800;margin:4px 0 16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #ece9e1;font-size:26px;font-weight:600}
.row b{color:#1f7a5a;font-size:28px}
.row i{color:#9a958b;font-style:normal}
</style></head><body>
<div class="l">
  <div class="brand"><img src="../src/icon-192.png" alt="">SplitLink 分帳連結</div>
  <h1>一條連結<br>就能分帳</h1>
  <p>免註冊・免下載・沒有筆數限制</p>
  <div class="tags"><span>多幣別</span><span>最少轉帳</span><span>結算圖片</span></div>
</div>
<div class="card">
  <div class="k">東京五日遊 · 4 人</div>
  <div class="t">3 筆轉帳就結清</div>
  <div class="row"><span>Amy <i>→</i> 小明</span><b>NT$16,614</b></div>
  <div class="row"><span>阿傑 <i>→</i> 小明</span><b>NT$9,154</b></div>
  <div class="row"><span>阿傑 <i>→</i> 小華</span><b>NT$4,675</b></div>
</div>
</body></html>
